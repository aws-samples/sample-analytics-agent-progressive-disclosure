# 商品名规格词池（按**二级类目**）。product_name = "品牌 叶子类目 规格"。
#
# ## 为什么要有第三段
#
# v1 的名字是「修饰词 + 品牌 + 叶子类目」（`优质戴森 电热水壶`），修饰词池是
# 「优质/热卖/精选」这类营销词，一眼看出是模板。规格段换成真实商品页上会出现的信息
# （容量/码数/能效/段位），既去掉了营销修饰词，也让同一「品牌+叶子」下的多个 SKU
# 名字不同——4133 个 SKU 只有 632 个合法(品牌,叶子)对，不加区分段会大量重名。
# L7 会用正则核对名字**不再**匹配「修饰词+品牌+类目」那个模板。
#
# ## 为什么按二级类目分池，而不是按一级
#
# 第一版按一级分池，跑出来立刻造出了新的错配——和 D-03 要修的是同一类毛病，只是
# 换到了规格字段上：
#
#     16+1T 老人机     （内存配置来自「数码」池，但老人机没有这个维度）
#     双门 吹风机       （能效/门数来自「家电」池，只对大家电成立）
#     1段 孕妇奶粉      （段位只对婴幼儿奶粉成立）
#     四件套 毛巾       （套件数只对床上用品成立）
#
# 修完品牌错配又在规格上造一批同形态的错配，等于没修。所以池子下沉到二级类目，
# 并且**每个池里的词必须对该二级类目下的所有叶子都成立**——上面四个例子里的词
# 因此都被剔掉了（数码>手机 池不再有内存配置，家电>大家电 池不再有「嵌入式」，
# 母婴>奶粉 池不再有段位，家居>家纺 池不再有套件数）。
#
# **仍然残留的粒度代价**，同样明写：二级仍不等于叶子，个别词在个别叶子上偏一点
# （「针织款 衬衫」「涂抹型才有 ml 的面膜」这种）。这类偏差和「戴森 电饭煲」不是
# 一个量级——它不构成事实错误，只是措辞不地道，所以不再往下沉到 126 个叶子池。
# 要沉也不需要改代码：`semantics.py` 的键校验换成叶子集合即可。
#
# 池子大小 10 是有约束来的，不是随手定的：632 对 × 10 = 6320 ≥ 目标 SKU 4133，
# 且单个(品牌,叶子)对最多能摊到 10 个不重名的 SKU。selftest 会核这条不等式。
name_specs:
  服装>女装:     [修身版, 宽松版, 经典款, 基础款, 通勤款, 度假风, 纯棉款, 针织款, 拼色款, 显瘦款]
