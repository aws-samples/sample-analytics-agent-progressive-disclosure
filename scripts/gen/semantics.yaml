# 商品语义约束（声明态）—— 品牌能经营哪些类目、各叶子类目的价格带
#
# ## 这份文件是谁的真源
#
# **生成器和检查集共用这一份。** `scripts/gen/tables.py` 的 products/product_tags
# builder 照它抽样，`scripts/lakehouse/verify_semantics.py`（L7）照它判违例。
# 两边各写一份的话，「修完生成器再改检查」就变成了自证——这是本项目已经栽过三次的
# 形态（见 docs/test-plan.md 的「比的两端不独立」那一条）。
#
# 在三方对账的结构里，这份属于**声明态**，和 `scripts/manifest/`（结构声明态）平级；
# 实际态是 Glue/Athena 里的数据，语义层是 `knowledge/`。
#
# ## 类目树不在这里，在 categories.csv
#
# 类目树的真源是 `data/csv/categories.csv`（166 行：8 个一级、32 个二级、126 个叶子），
# 它是 `budget.py` 里的 FIXED 表、本轮不重新生成。所以这份配置**只用路径引用**类目，
# 不复制一份树结构。`semantics.py` 启动时逐条核对：
#   · 126 个叶子路径每一个都有价格带，多一个少一个都报错；
#   · 每个品牌声明的类目路径都在树里存在；
#   · **每个叶子类目至少有一个品牌能经营它**（否则生成器抽不出品牌，会静默塌到少数类目）。
#
# ## 价格带的判据（必须可复核，不能是执行者的行业印象）
#
# `price_bands` 的区间是**现价 `products.price`**，单位元。取值口径统一为：
#   下界 = 该叶子类目在国内主流电商平台的入门款常见成交价；
#   上界 = 该类目主流高端款的常见成交价。
# **刻意不覆盖极端长尾**（限量款、工程机、批发整箱），因为生成器只需要产出常见品；
# 覆盖长尾会把带宽拉到几百倍，L7 的「价格越界 0」就退化成一条永远通过的检查。
#
# 实测带宽（上界/下界）：中位 12.8×，范围 3.5× ~ 61.2×。最窄的是
# 数码>手机>游戏手机（3.5×，本来就是个窄众品类）、母婴>奶粉（4.6×，罐装价高度集中）；
# 最宽的是 数码>配件>耳机（61×，几十元入耳到两三千头戴确实同属一个叶子）、
# 母婴>玩具>积木（51×）、家电>小家电>吹风机（51×，59 元电吹风到戴森）。
# 跑 `python3 scripts/gen/semantics.py` 会把这个分布打出来。
#
# `semantics.py` 里的 MAX_BAND_RATIO 是**量级打字错的护栏**（把 `[9, 99]` 敲成
# `[9, 99999]`），不是真实性判据——所以它定在 100× 这个整数门槛上，而不是贴着上面
# 那个 61.2× 的实测最大值。贴着实测值定，等于让检查去迎合当前数据，下次改配置时
# 改的人只会去调常量。价格的真实性靠别的两件事：下面的品牌分档把带切成子区间，
# 以及 L6 把每个类目的实际价格跨度打出来供人复核。
#
# ## 品牌分档的作用：解决「平价品牌卖高价」
#
# 光有类目价格带挡不住「完美日记 女士香水 1430 元」这种——香水带上界确实到 2599，
# 但完美日记是平价彩妆品牌。所以每个品牌带一个 `tier`，各档只允许落在类目带的一段：
#
#   budget  → 带内 [0%, 45%]     平价/大众品牌
#   mid     → 带内 [15%, 80%]    主流品牌
#   premium → 带内 [45%, 100%]   高端/进口品牌
#
# 三档刻意留重叠区（15%~45%、45%~80%）：真实市场里主流品牌的入门款会低于平价品牌的
# 顶配，硬切成互斥区间反而不真实，而且会在带的边界上造出人工的价格空隙。
#
# ## 白名单粒度：二级类目为主，必要时写到叶子
#
# `categories` 里既可以写二级路径（`家电>小家电`，覆盖其下全部叶子），也可以写叶子
# 路径（`家电>小家电>吹风机`）。绝大多数品牌写二级就够；戴森、张小泉、云南白药这类
# 只做少数单品的写到叶子。
#
# **已知的粒度代价，明写在这里**：凡是用二级路径的品牌，其下所有叶子都算合法，
# 所以「戴森 电饭煲」这类同一二级类目内的叶子级错配**不在 L7 的判据内**（戴森本身
# 写的是叶子路径，此处只是举例形态）。要收紧不需要改代码，把该品牌的 `categories`
# 从二级改写成叶子清单即可——这也是为什么加载器同时接受两种粒度。
#
# ## 改这份文件之后
#
# 生成器和 L7 会一起变。跑 `python3 scripts/gen/semantics.py --selftest` 先验配置
# 自洽（秒级、不连云），再跑 `python3 scripts/gen/selftest_closures.py`。

version: 1

# 品牌分档 → 允许落在类目价格带的哪一段（比例，0=下界 1=上界）
tier_windows:
  budget:  [0.00, 0.45]
  mid:     [0.15, 0.80]
  premium: [0.45, 1.00]

