# 用户画像 ⟷ 消费行为的相关性配置（D-01 / 导师任务书的 L8）
#
# ## 这份文件解决什么
#
# 审计发现四个画像维度的人均实付 GMV 档间极差只有 1.4% / 3.2% / 4.9% / 7.0%——
# 分档之间没有可用的区分度。任务书说「机制解释尚未从代码侧确认」，现在确认了，
# 而且成因有**两处**独立断开的边：
#
#   1. `tables.py::build_user_profiles` 里每一列都是自己一条 rng 流独立抽的
#      （age=int_uniform(18,60)、gender/income_level=各自的 enum、occupation=等概率
#      from_pool），没有一列读过任何行为量；
#   2. `tables.py::_prep_orders` 里 `total` 先按全局 lognormal 抽完，`uid` 之后才由
#      `_pick_registered_user` 按下单日分配——**金额与「谁下的单」也是独立的**。
#
# 所以只把画像列改成相关是不够的：第 2 条不修，极差仍然是 0。任务书只点了第 1 处。
#
# ## 为什么判据要外置到这里
#
# 「高收入档应该比低收入档花得多」「12 个职业的人数不该一样多」这类判断如果写死在
# 检查器代码里，就成了写代码那个人的行业印象，别人无法复核、也无法修正。
#
# ## 三个 section 的边界是刻意的，不要合并
#
#   · `dimensions:` 取值域。两侧共用——值域是业务事实，不是判据也不是效应量。
#   · `judge:`      只有检查侧读。通过线 + 顺序约束 + 统计功效参数。
#   · `generate:`   只有生成侧读。效应量（倍率）与人数权重。
#
# **检查侧不许读 `generate:`**。`profiles.py` 的 `load()` 返回 `Judge` / `Generate`
# 两个独立数据类就是为了让这条边界结构化、而不是靠自觉。理由：拿生成器的倍率去推
# 检查器的通过线，就是拿函数的输出验函数——两端不独立，一致不携带信息。本项目已经在
# `verify_enums.py`、`reconcile.py` H 类等五处踩过这个形态，逐条记在 docs/test-plan.md。
#
# 所以两个 section 的数字**故意不一样**：`generate:` 的倍率按真实电商的画像差异定，
# `judge:` 的通过线按「多大的差异才够支撑分层动作」独立推导。
#
# 唯一的例外是 `profiles.py` 加载时会断言「倍率跨度留出余量地高于通过线」。它不是
# 用倍率去算通过线（那才是自证），而是拦一种具体的事故：有人调小倍率、或调高通过线，
# 于是生成出来的数据**先天过不了自己的检查**。把它拦在 load 而不是拦在跑数据那一刻，
# 是因为前者秒级、后者要先造几十万行。注意这条断言对「有人把通过线调松」无能为力——
# 那件事得靠 code review 和这些 `why` 字段。

version: 1

# ---------------------------------------------------------------- 取值域（两侧共用）
dimensions:
  # `income_level` 的顺序**有意义**：judge 的 monotone 约束按这个顺序判，
  # 生成侧的倍率也按这个顺序检查单调性。写反了两边会一起错，所以下面有断言。
  income_level: [low, medium, high, very_high]
  # 卡片实测 500 行只有 female / male 两个值。`unknown` 留在值域里是因为任务书的
  # v2 库有这一档、且它是 judge 的 not_top 约束的对象；v3 数据里它无输入，
  # 检查器会明说「这条判据此刻不含信息」而不是假装通过。
  gender: [female, male, unknown]

  # **值域里存在、但生成器不产**的档位。必须显式声明，不能只写在注释里：
  # `gender` 的倍率跨度算上 unknown（0.70）是 64%，只算真会出现的 female/male 是 35%。
  # 加载时那条「倍率跨度 ≥ 通过线 × MARGIN」的断言如果按 64% 算，就是拿一个**永远不会
  # 出现在数据里**的档位去证明效应够大——余量看着 4.3×，实际只有 2.3×。
  # 检查侧也要这份清单：not_top 那条约束在这些档位上应当报「无输入」而不是「通过」。
  not_generated:
    gender: [unknown]
  # 职业池的**真源就是这里**。原来它写死在 `tables.py::OCCUPATIONS`，而 D-01 的
  # 旁证缺陷（12 档人数极差仅 3.3%）正是那份列表配等概率抽样的结果。搬到配置里之后
  # 只有一份，`tables.py` 从这里读。DDL 和 knowledge 卡片都没有声明这一列的枚举，
  # 所以没有第三方真源可比对——这也是它值得被搬进配置的理由。
  # 取值对齐 knowledge/domains/user/user_profiles.md 的「### occupation 职业」，
  # 那张表 2026-08-28 按线上库实测补上——在那之前**卡片整个没声明过这一列**，于是
  # 下面这份池子没有任何外部真源可比对（原注释就是这么写的）。改动：删掉库里不存在的
  # 财务 / 管理者 / 其他，补上 产品经理 / 程序员 / 律师 / 市场营销 / 金融从业者 / 企业主。
  # 「其他」这类兜底档是刻意删的：真实画像表里没有它，留着会让"职业分布"多一个
  # 无法解释的大桶。occupation_mult 与 occupation_weights 的键集合必须同步改
  # （profiles.py 双向校验键集合，见该文件第 27 条）。
  occupation: [学生, 工程师, 程序员, 产品经理, 教师, 医生, 律师, 销售, 市场营销,
               设计师, 运营, 金融从业者, 公务员, 自由职业, 企业主]
  # 年龄是连续值，分档口径写在这里。**生成侧和检查侧必须用同一个分档函数**
  # （`profiles.py::age_decade`）：生成器按 `age//10*10` 索引倍率、检查器按
  # `(age-18)//10` 分组的话，量的就是另一个划分，红绿都读不出意思。
  # 口径与任务书 L8 的查询骨架一致（`age/10*10`）。
  age:
    min: 18
    max: 60
    bucket: decade

# ---------------------------------------------------------------- 检查侧
judge:
  # 每个维度的档间极差通过线。极差 = (max(人均GMV) - min(人均GMV)) / min(人均GMV)，
  # 口径照任务书 L8 的骨架：人均 = 该档**下过有效单的用户**的 SUM(actual_amount) 均值，
  # 有效 = status IN ('paid','shipped','delivered')。
  #
  # **通过线按维度分别推导，不是取一个能把四个都判失败的统一值。** 任务书建议
  # 「可以先把阈值定在一个能把这四个都判失败的位置，修完再回调」——这一条没有照做，
  # 因为它是**按测量结果反推阈值**，正是任务书自己在别处要求避免的那件事（判据要可复核、
  # 不能是执行者的行业印象，同样也不能是对手头数据的复述）。更要紧的是它会造出假信号：
  # 真实电商里 gender 的人均 GMV 差异本来就只有一两成，硬要求它 ≥50% 等于把数据编得
  # 比现实更有区分度，那样「按性别投放」会拿到一个现实中不存在的回报差。
  #
  # 按下面这四条推导出来的线，审计那四个值（1.4% / 3.2% / 4.9% / 7.0%）**照样全部不达标**，
  # 所以「不迁就测量」并没有放过这个缺陷。每条的依据写在 `why` 里，允许被单独反驳、单独改。
  ranges:
    income_level:
      min_range: 0.80
      why: >-
        收入是消费额最直接的驱动，真实电商的收入分档人均 GMV 顶档/底档常见在 2~3 倍。
        取 1.8 倍（极差 80%）作下限，比常见值保守。低于这个数，「按收入分层做预算分配」
        这个动作拿不到可辨别的回报差，分层就没有意义。
    occupation:
      min_range: 0.60
      why: >-
        职业混合了收入与生命阶段两种差异（学生 ⟷ 企业主），离散度本应比收入档更大，
        但档数多（15）、单档样本小，测出来的极差更容易被噪声压缩。取 1.6 倍。
    age:
      min_range: 0.30
      why: >-
        真实年龄-消费曲线是**驼峰**而不是单调：25~44 岁是高峰，18~24 与 55+ 是低谷，
        峰谷比常见 1.4~1.8 倍。取 1.3 倍作下限。这里刻意比收入低得多——年龄本身的
        解释力就弱（它的效应大半通过收入体现），要求它同样强就是编数据。
    gender:
      min_range: 0.15
      why: >-
        性别的人均 GMV 差异取决于品类结构，真实值常见一到三成，个别垂类才更大。取 15%。
        这是四条里最松的一条，**刻意如此**：把它定高会逼生成器造出现实里不存在的性别鸿沟。

  # 除极差之外的顺序约束。极差只管「有多大差别」，管不了「差在正确的方向上」——
  # 审计里 medium 档最低、60 后高于 30 后、unknown 最高、学生高于管理者，
  # 这四处极差再大也仍然是错的，所以顺序必须单独成条。任务书也要求「顺序约束单独成条」。
  order:
    - dim: income_level
      kind: monotone
      why: >-
        收入档与人均 GMV 必须同向单调（按 dimensions.income_level 的顺序）。
        审计里 medium 档最低，这是独立抽样的直接指纹：任何真实机制都不会让中间档垫底。
    - dim: age
      kind: peak_within
      buckets: [20, 30, 40]
      why: >-
        用「峰值必须落在 20~49 岁这三个十年档内」而不是单调：年龄对消费的真实关系是驼峰，
        要求单调递增会把「60 后花得最多」换成另一个同样假的形态（「越老花得越多」）。
        范围给三档而不是钉死一档，是因为峰值究竟在 20 档还是 30 档取决于品类结构，
        钉死就成了对某一种商品结构的断言。审计里峰值在 60 档——等概率抽样下峰值随机落点。
    - dim: gender
      kind: not_top
      buckets: [unknown]
      why: >-
        `unknown` 是数据质量桶（性别缺失），不是一个人群。它在价值排名里登顶只能说明
        分桶与消费无关。真实库里缺失组的人均值通常偏低：愿意填资料的用户参与度也更高。
        v3 数据不产 unknown，这条会报「无输入」——不是通过。
    - dim: occupation
      kind: outranks
      buckets: [企业主, 学生]
      why: >-
        企业主的人均 GMV 必须高于学生。这是四条里最不依赖建模假设的一条（可支配支出的
        差距在任何口径下都成立），而审计里恰好是反的（原文是「管理者垫底、学生高于
        管理者」——`管理者` 这个取值 2026-08-28 随池子对齐线上库时删掉了，居首的位置
        交给同属高可支配支出的 `企业主`；被反驳的那条审计结论本身不变）。

  # 维度自身的分布是否合理。不关联任何行为表就能判，所以在报告里排在相关性之前——
  # 任务书：「这类『维度自身分布是否合理』的检查比消费相关性更省事，应该排在前面」。
  shape:
    occupation_user_count_min_range: 1.50
    occupation_why: >-
      真实职业构成里最大类与最小类差几倍是常态：宽口径桶（学生、销售、自由职业）天然大，
      窄口径专业桶（医生、律师、企业主）天然小。取 2.5 倍（极差 150%）作下限。等概率抽样产出的极差
      随样本量趋于 0，所以这条判据在样本越大时越灵敏，不需要按规模调阈值。
      注意这一条判的是**全部用户**（不 join 订单），审计里那 3.3% 也是这个口径。

  # 统计功效。这不是第二道阈值，是**一道前置的资格检查**：先问「这批数据有没有可能
  # 分辨出 min_range 这么大的差异」，答案是否才去看实测极差。
  #
  # 判法：设极端两档的人均 GMV 标准误为 SE_max / SE_min，取 SE_diff =
  # sqrt(SE_max² + SE_min²)。若 `min_range × 底档人均 < n_sigma × SE_diff`，说明**哪怕
  # 真实效应恰好等于通过线，这批数据也测不出来**，此时判 WEAK（分辨不出），不判 FAIL。
  #
  # 这个区分是有代价才加的：FAIL 和 WEAK 的修法完全不同——前者改生成器，后者加数据量。
  # 混成一个红灯，小样本上的每次运行都会把人推向「去调生成器」，而那时生成器可能是对的。
  # 反过来，WEAK 也不是免罪符：它用的是**通过线**而不是实测极差算功效，所以不会出现
  # 「实测极差恰好很小 → 自动判成看不清」这种事后开脱。
  noise_floor:
    n_sigma: 6.0
    why: >-
      6 倍标准误。取得保守是因为这里同时比较多个档（4~12 个），多重比较会抬高「最大极差」
      的期望——按单次比较的 2σ 定会虚报显著。审计那四个极差都在 2σ 以内，也就是与零无法区分。

# ---------------------------------------------------------------- 生成侧
#
# 检查侧不读这一段（见文件头）。数字按真实电商的画像差异定。
generate:
  # 每个用户的消费强度倍率 = 四个维度倍率之积，再整体归一到均值 1
  # （保证全库 GMV 量级不漂移；不归一的话 D-01 的修复会顺带改掉 GMV 总量，
  # 而 L5 的口径恒等式两边都是现算的 SQL，不会红——于是量级漂移无人察觉）。
  #
  # 倍率跨度必须**明显大于** judge 的通过线，`profiles.py` 加载时断言这件事。
  # 余量的用处：分档倍率是「同档用户的期望强度」，实测极差是它经过订单数长尾、
  # 状态过滤、per-user 平均之后的残余，只会被压缩，不会被放大。
  spend_multiplier:
    # 跨度 4.7×，远高于 0.80 的通过线。四档的形状按可支配收入的常见比例给。
    income_level:
      low: 0.55
      medium: 0.90
      high: 1.55
      very_high: 2.60
    # 跨度 3.7×（企业主 / 学生），高于 0.60。学生垫底、企业主居首——正好把审计里
    # 「管理者垫底、学生高于管理者」那条反过来（`管理者` 这个取值 2026-08-28 随池子
    # 对齐线上库时删掉了，居首的位置交给 `企业主`；被反驳的那条审计结论不变）。
    # 中段挤在 0.95~1.10 是有意的：真实数据里大多数职业彼此差不多，把 15 档摊成等差
    # 会造出一个假的阶梯。
    occupation:
      学生: 0.55
      自由职业: 0.85
      运营: 0.95
      市场营销: 0.98
      销售: 1.00
      教师: 1.00
      设计师: 1.05
      公务员: 1.10
      工程师: 1.35
      程序员: 1.40
      产品经理: 1.45
      医生: 1.55
      律师: 1.70
      金融从业者: 1.80
      企业主: 2.05
    # 键是十年档下界（`profiles.py::age_decade` 的输出）。跨度 2.15×，高于 0.30。
    # 形状是驼峰，峰在 30 档：judge 只要求峰落在 [20,30,40] 之内，这里落在中间，
    # 留出余量——贴着允许区间的边缘定，等于让生成器去卡检查器的边界。
    age_decade:
      10: 0.65      # 只有 18~19 岁落在这里（dimensions.age.min=18），学生为主
      20: 0.95
      30: 1.40      # 25~44 那段高峰的主体，收入与家庭支出双高
      40: 1.30
      50: 0.95
      60: 0.70      # 只有 60 岁整（dimensions.age.max=60）
    # 跨度 1.35×（female / male；`unknown` 不参与，见 dimensions.not_generated），
    # 高于 0.15 的通过线。通过线 15% 与倍率 35% 刻意不相等：15% 是「多小就不值得据此
    # 分层」，35% 是「真实综合电商里女性人均 GMV 高出的常见幅度」。前者是底线，后者是
    # 事实描述，两者不该是同一个数。
    gender:
      female: 1.15
      male: 0.85
      unknown: 0.70   # 缺失组参与度偏低。生成器不产它，倍率留着只为值域完整
  # 职业人数分布权重。等概率是 D-01 的旁证缺陷，这里给一份有形状的。
  # 依据同 judge.shape.occupation_why：宽口径桶天然大，窄口径专业桶天然小。
  # 极差 160/25 = 6.4×，高于 1.50 的通过线。合计 1000，便于当千分比读。
  # 大桶是宽口径的（学生、销售、运营），小桶是执业门槛高的（律师、企业主、医生）。
  occupation_weights:
    学生: 160
    销售: 105
    运营: 95
    工程师: 92
    教师: 90
    自由职业: 85
    市场营销: 78
    程序员: 75
    设计师: 70
    产品经理: 62
    公务员: 60
    金融从业者: 45
    医生: 30
    律师: 28
    企业主: 25

  # 这两列的边际分布**不许在这里给权重**：它们被 knowledge 卡片钉住
  # （gender 258/242、income_level 230/119/105/46），真源是 `tables.py` 里那两个
  # `F.enum` 的权重，`verify_enums.py` 和 `reconcile.py` 都在比。在这里再写一份
  # 就是第二个副本，而两份权重不一致时数据会静默偏离卡片。
  # `profiles.py` 加载时断言 `spend_multiplier` 之外没有这两列的权重键。
  preserve_marginals: [gender, income_level]
