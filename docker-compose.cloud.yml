# ============================ LEGACY —— 不再维护 ============================
# v1 的自带库形态:容器版 Postgres(首启自动灌 35 表 19 万行) + FastAPI agent 应用。
#
# v2 之后正式形态是 Redshift Serverless + Glue Data Catalog + AgentCore Runtime
# (见 docs/architecture-v2-redshift-glue.md、docs/legacy.md)。这套 compose 起的
# 是那个约 19 万行的旧数据集,没有 Glue 目录,治理也不在数仓里——UI 的元数据会降级
# 到 information_schema。留着是为了让"数据在本地容器里"这个旧路径还能跑起来,
# 但不再随 v2 演进,也不在测试套件覆盖范围内。
#
# 在 EC2 上:docker compose -f docker-compose.cloud.yml up -d --build
# ===========================================================================
services:
  db:
    image: postgres:16
    container_name: analytics-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/ddl:ro      # DDL(子目录,不被 entrypoint 自动跑)
      - ./data/csv:/data/csv:ro                            # CSV 数据
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/99-init.sh:ro  # 显式建表+灌数+重置序列
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: analytics-app
    environment:
      CLAUDE_CODE_USE_BEDROCK: "1"
      AWS_REGION: us-east-1
      ANTHROPIC_MODEL: global.anthropic.claude-opus-4-8
      # 显式钉住 postgres：这套 compose 自带 db 容器，走的是 v1 路径。
      # db.py 的默认值现在是 athena（Aurora / Redshift 都已退役），不钉住这里
      # 会绕过自带的 db 容器去查湖仓——起得来、也查得出数，只是**查的不是这套
      # compose 灌的那份库**，而两边数还不一样（19 万行 ⟷ 48 表 22 万行）。
      DB_BACKEND: postgres
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: app_analytics
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: "8000"
      AUTH_ENABLED: "${AUTH_ENABLED:-1}"
      # Cognito app 层认证:把你自己的用户池 / 客户端 ID 放进 .env(见 .env.example)。
      # 这些是公共客户端标识(非密钥),仍建议用 .env 管理而非硬编码进 compose。
      COGNITO_REGION: "${COGNITO_REGION:-us-east-1}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8000"     # 主机 80 ← CloudFront 源站;容器内 uvicorn 8000
    restart: unless-stopped

volumes:
  pgdata:
